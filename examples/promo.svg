<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DA291C"/>
      <stop offset="1" stop-color="#B01F14"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1080" height="1440" fill="#FFF6E3"/>
  <rect width="1080" height="16" fill="#FFC72C"/>

  <!-- header -->
  <!-- golden arches M -->
  <g transform="translate(78,64)">
    <path d="M 0 92 V 30 Q 0 8 22 8 Q 44 8 44 42 V 70 Q 44 88 62 88 Q 80 88 80 70 V 42 Q 80 8 102 8 Q 124 8 124 30 V 92"
          fill="none" stroke="#FFC72C" stroke-width="17" stroke-linecap="round"/>
  </g>
  <text x="240" y="112" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="58" font-weight="900" fill="#DA291C" letter-spacing="4">麦门人格鉴定所</text>
  <text x="242" y="158" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="27" fill="#7A4A1E">你的麦当劳订单，藏着你的人格密码</text>
  <line x1="78" y1="196" x2="1002" y2="196" stroke="#E8D9B0" stroke-width="2"/>

  <!-- side stickers -->
  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif">
    <!-- left -->
    <g transform="rotate(-6 130 430)">
      <rect x="46" y="386" width="170" height="88" rx="14" fill="#FFFFFF" stroke="#DA291C" stroke-width="3"/>
      <text x="131" y="422" font-size="21" fill="#9A8B6C" text-anchor="middle">嗜辣度</text>
      <text x="131" y="456" font-size="34" font-weight="900" fill="#DA291C" text-anchor="middle">95%</text>
    </g>
    <g transform="rotate(5 150 620)">
      <rect x="52" y="576" width="176" height="88" rx="14" fill="#FFFFFF" stroke="#FFC72C" stroke-width="3"/>
      <text x="140" y="612" font-size="21" fill="#9A8B6C" text-anchor="middle">新品命中</text>
      <text x="140" y="646" font-size="34" font-weight="900" fill="#D98E04" text-anchor="middle">52%</text>
    </g>
    <g transform="rotate(-4 150 810)">
      <rect x="48" y="766" width="184" height="88" rx="14" fill="#FFFFFF" stroke="#7A4A1E" stroke-width="3"/>
      <text x="140" y="802" font-size="21" fill="#9A8B6C" text-anchor="middle">深夜下单</text>
      <text x="140" y="836" font-size="34" font-weight="900" fill="#7A4A1E" text-anchor="middle">47%</text>
    </g>
    <!-- right -->
    <g transform="rotate(6 950 470)">
      <rect x="862" y="426" width="176" height="88" rx="14" fill="#FFFFFF" stroke="#DA291C" stroke-width="3"/>
      <text x="950" y="462" font-size="21" fill="#9A8B6C" text-anchor="middle">分享狂魔</text>
      <text x="950" y="496" font-size="34" font-weight="900" fill="#DA291C" text-anchor="middle">95%</text>
    </g>
    <g transform="rotate(-5 940 660)">
      <rect x="856" y="616" width="172" height="88" rx="14" fill="#FFFFFF" stroke="#FFC72C" stroke-width="3"/>
      <text x="942" y="652" font-size="21" fill="#9A8B6C" text-anchor="middle">精算度</text>
      <text x="942" y="686" font-size="34" font-weight="900" fill="#D98E04" text-anchor="middle">73%</text>
    </g>
    <g transform="rotate(4 950 850)">
      <rect x="860" y="806" width="180" height="88" rx="14" fill="#2B2118"/>
      <text x="950" y="842" font-size="21" fill="#C9B98F" text-anchor="middle">真实订单 10 单</text>
      <text x="950" y="876" font-size="30" font-weight="900" fill="#FFC72C" text-anchor="middle">全部可复现</text>
    </g>
  </g>

  <!-- persona card (embedded) -->
  <g>
    <rect x="286" y="226" width="508" height="1023" rx="22" fill="#FFFFFF"/>
    <rect x="292" y="232" width="496" height="1011" rx="18" fill="#FFF9EC" stroke="#E8D9B0" stroke-width="2"/>
    <image href="card.svg" x="300" y="240" width="480" height="995" preserveAspectRatio="xMidYMin meet"/>
  </g>

  <!-- bottom CTA -->
  <rect x="0" y="1256" width="1080" height="184" fill="url(#hdr)"/>
  <rect x="0" y="1256" width="1080" height="6" fill="#FFC72C"/>
  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif" text-anchor="middle">
    <text x="540" y="1322" font-size="40" font-weight="900" fill="#FFFFFF" letter-spacing="2">GitHub 搜索：mcd-mbti</text>
    <text x="540" y="1382" font-size="28" fill="#FFE9B8">测测你是什么麦门人格 · 点亮 ⭐ 即是麦门认证</text>
  </g>
  <text x="1028" y="1322" font-family="'Microsoft YaHei',sans-serif" font-size="24" fill="#FFE9B8" text-anchor="end">开源参赛作品</text>
</svg>
