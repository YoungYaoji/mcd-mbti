<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DA291C"/>
      <stop offset="1" stop-color="#B01F14"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1920" fill="#FFF6E3"/>
  <rect width="1080" height="16" fill="#FFC72C"/>

  <!-- header -->
  <g transform="translate(78,58)">
    <path d="M 0 92 V 30 Q 0 8 22 8 Q 44 8 44 42 V 70 Q 44 88 62 88 Q 80 88 80 70 V 42 Q 80 8 102 8 Q 124 8 124 30 V 92"
          fill="none" stroke="#FFC72C" stroke-width="17" stroke-linecap="round"/>
  </g>
  <text x="238" y="106" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="54" font-weight="900" fill="#DA291C" letter-spacing="3">麦门人格鉴定所</text>
  <text x="240" y="148" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="26" fill="#7A4A1E">用你的麦当劳订单，测你的麦门人格</text>
  <line x1="78" y1="184" x2="1002" y2="184" stroke="#E8D9B0" stroke-width="2"/>

  <!-- contest banner -->
  <rect x="0" y="196" width="1080" height="110" fill="url(#hdr)"/>
  <rect x="0" y="306" width="1080" height="6" fill="#FFC72C"/>
  <g transform="translate(104,208)">
    <path d="M 6 6 H 78 V 32 Q 78 62 42 66 Q 6 62 6 32 Z" fill="#FFC72C"/>
    <path d="M 6 14 Q -14 14 -12 32 Q -10 50 8 50" fill="none" stroke="#FFC72C" stroke-width="7" stroke-linecap="round"/>
    <path d="M 78 14 Q 98 14 96 32 Q 94 50 76 50" fill="none" stroke="#FFC72C" stroke-width="7" stroke-linecap="round"/>
    <rect x="36" y="66" width="12" height="16" fill="#FFC72C"/>
    <rect x="22" y="82" width="40" height="9" rx="4" fill="#FFC72C"/>
  </g>
  <text x="230" y="254" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="32" font-weight="900" fill="#FFFFFF">麦当劳程序员创意开发大赛 · 参赛作品</text>
  <text x="230" y="290" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="22" fill="#FFE9B8">完全开源 · 免费使用 · 求 Star 支持</text>

  <!-- intro card -->
  <rect x="78" y="326" width="924" height="260" rx="18" fill="#FFFFFF" stroke="#E8D9B0" stroke-width="2"/>
  <text x="110" y="372" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="30" font-weight="900" fill="#2B2118">这是个什么项目？</text>
  <text x="110" y="410" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="22" fill="#7A4A1E">输入你的麦当劳真实订单，四轴算法算出你是 16 型麦门人格中的哪一型</text>
  <text x="110" y="444" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="22" fill="#7A4A1E">输出专属 SVG 人格鉴定卡，附麦门成分分析（猎奇 / 嗜辣 / 夜猫 / 精算 / 分享）</text>
  <rect x="110" y="470" width="212" height="56" rx="28" fill="#FFF6E3" stroke="#F0E3BC" stroke-width="1.5"/>
  <text x="216" y="505" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="20" font-weight="900" fill="#7A4A1E" text-anchor="middle">真实订单数据</text>
  <rect x="333" y="470" width="212" height="56" rx="28" fill="#FFF6E3" stroke="#F0E3BC" stroke-width="1.5"/>
  <text x="439" y="505" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="20" font-weight="900" fill="#7A4A1E" text-anchor="middle">四轴算法评分</text>
  <rect x="556" y="470" width="212" height="56" rx="28" fill="#FFF6E3" stroke="#F0E3BC" stroke-width="1.5"/>
  <text x="662" y="505" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="20" font-weight="900" fill="#7A4A1E" text-anchor="middle">16 型人格</text>
  <rect x="779" y="470" width="212" height="56" rx="28" fill="#FFF6E3" stroke="#F0E3BC" stroke-width="1.5"/>
  <text x="885" y="505" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="20" font-weight="900" fill="#7A4A1E" text-anchor="middle">只读 · 不开券</text>
  <text x="110" y="556" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="20" font-weight="900" fill="#DA291C">作者实测：ENTP 麦门发明家 · 嗜辣度 95% · 精算度 73% · 分享欲 95%</text>

  <!-- flow map -->
  <rect x="78" y="612" width="262" height="60" rx="30" fill="#FFFFFF" stroke="#E8D9B0" stroke-width="2"/>
  <text x="209" y="650" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="26" font-weight="900" fill="#2B2118" text-anchor="middle">① 打开链接</text>
  <text x="372" y="650" font-family="'Microsoft YaHei',sans-serif" font-size="28" font-weight="900" fill="#DA291C" text-anchor="middle">→</text>
  <rect x="404" y="612" width="262" height="60" rx="30" fill="#FFFFFF" stroke="#E8D9B0" stroke-width="2"/>
  <text x="535" y="650" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="26" font-weight="900" fill="#2B2118" text-anchor="middle">② 注册 / 登录</text>
  <text x="698" y="650" font-family="'Microsoft YaHei',sans-serif" font-size="28" font-weight="900" fill="#DA291C" text-anchor="middle">→</text>
  <rect x="732" y="612" width="270" height="60" rx="30" fill="#FFC72C"/>
  <text x="867" y="650" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="26" font-weight="900" fill="#7A4A1E" text-anchor="middle">③ 点亮 Star</text>

  <!-- step 1 -->
  <rect x="78" y="700" width="924" height="330" rx="18" fill="#FFFFFF" stroke="#E8D9B0" stroke-width="2"/>
  <circle cx="130" cy="750" r="26" fill="#DA291C"/>
  <text x="130" y="761" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="30" font-weight="900" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="176" y="761" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="32" font-weight="900" fill="#2B2118">打开项目链接</text>
  <rect x="110" y="778" width="560" height="40" rx="20" fill="#FFFFFF" stroke="#E0D5B8" stroke-width="1.5"/>
  <text x="134" y="803" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="21" font-weight="900" fill="#2B2118">github.com/YoungYaoji/mcd-mbti</text>
  <text x="700" y="803" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="19" fill="#9A8B6C">复制到手机浏览器打开</text>

  <!-- mockup: GitHub repo page -->
  <rect x="110" y="830" width="880" height="180" rx="12" fill="#F7F4EE" stroke="#E0D5B8" stroke-width="1.5"/>
  <rect x="110" y="830" width="880" height="38" rx="12" fill="#24292F"/>
  <rect x="110" y="856" width="880" height="12" fill="#24292F"/>
  <text x="142" y="857" font-family="'Microsoft YaHei',sans-serif" font-size="20" font-weight="900" fill="#FFFFFF">GitHub</text>
  <rect x="270" y="836" width="190" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.12"/>
  <text x="286" y="855" font-family="'Microsoft YaHei',sans-serif" font-size="17" fill="#C9D1D9">Search…</text>
  <rect x="730" y="834" width="106" height="32" rx="8" fill="#1F883D"/>
  <text x="783" y="856" font-family="'Microsoft YaHei',sans-serif" font-size="19" font-weight="900" fill="#FFFFFF" text-anchor="middle">Sign up</text>
  <rect x="724" y="828" width="118" height="44" rx="12" fill="none" stroke="#FFC72C" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="783" y="890" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="19" font-weight="900" fill="#DA291C" text-anchor="middle">没账号？先点这里注册</text>

  <circle cx="156" cy="912" r="16" fill="#DA291C"/>
  <text x="156" y="918" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">Y</text>
  <text x="188" y="906" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="23" font-weight="900" fill="#2B2118">YoungYaoji / mcd-mbti</text>
  <rect x="460" y="894" width="72" height="24" rx="12" fill="none" stroke="#C9B98F" stroke-width="1.5"/>
  <text x="496" y="911" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="17" fill="#7A4A1E" text-anchor="middle">Public</text>
  <rect x="140" y="936" width="106" height="36" rx="18" fill="#FFFFFF" stroke="#C9B98F" stroke-width="1.5"/>
  <text x="193" y="960" font-family="'Microsoft YaHei',sans-serif" font-size="18" fill="#7A4A1E" text-anchor="middle">Watch 3</text>
  <rect x="256" y="936" width="106" height="36" rx="18" fill="#FFFFFF" stroke="#C9B98F" stroke-width="1.5"/>
  <text x="309" y="960" font-family="'Microsoft YaHei',sans-serif" font-size="18" fill="#7A4A1E" text-anchor="middle">Fork 0</text>
  <rect x="372" y="936" width="130" height="36" rx="18" fill="#FFFFFF" stroke="#C9B98F" stroke-width="1.5"/>
  <text x="437" y="960" font-family="'Microsoft YaHei',sans-serif" font-size="19" fill="#7A4A1E" text-anchor="middle">☆ Star 3</text>
  <rect x="366" y="930" width="142" height="48" rx="24" fill="none" stroke="#DA291C" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="437" y="992" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="18" font-weight="900" fill="#DA291C" text-anchor="middle">第 3 步点这里</text>
  <text x="110" y="1018" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="19" fill="#9A8B6C">右上角是 Sign up = 没登录先做第 2 步；是头像 = 已登录直接第 3 步</text>

  <!-- step 2 -->
  <rect x="78" y="1058" width="924" height="230" rx="18" fill="#FFFFFF" stroke="#E8D9B0" stroke-width="2"/>
  <circle cx="130" cy="1108" r="26" fill="#DA291C"/>
  <text x="130" y="1119" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="30" font-weight="900" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="176" y="1119" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="32" font-weight="900" fill="#2B2118">邮箱注册（已登录可跳过）</text>

  <rect x="110" y="1140" width="880" height="130" rx="12" fill="#F7F4EE" stroke="#E0D5B8" stroke-width="1.5"/>
  <text x="140" y="1164" font-family="'Microsoft YaHei',sans-serif" font-size="26" font-weight="900" fill="#2B2118">Join GitHub</text>
  <text x="140" y="1184" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="19" fill="#9A8B6C">创建账号 · 一个邮箱就够</text>
  <rect x="140" y="1194" width="380" height="36" rx="8" fill="#FFFFFF" stroke="#DDD5C2" stroke-width="1.5"/>
  <text x="158" y="1218" font-family="'Microsoft YaHei',sans-serif" font-size="18" fill="#B9AE94">Email</text>
  <rect x="540" y="1194" width="380" height="36" rx="8" fill="#FFFFFF" stroke="#DDD5C2" stroke-width="1.5"/>
  <text x="558" y="1218" font-family="'Microsoft YaHei',sans-serif" font-size="18" fill="#B9AE94">Password</text>
  <rect x="140" y="1234" width="240" height="34" rx="8" fill="#1F883D"/>
  <text x="260" y="1257" font-family="'Microsoft YaHei',sans-serif" font-size="19" font-weight="900" fill="#FFFFFF" text-anchor="middle">Create account</text>
  <text x="410" y="1257" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="19" fill="#9A8B6C">不用装任何东西 · 一分钟完事</text>

  <!-- step 3 -->
  <rect x="78" y="1316" width="924" height="280" rx="18" fill="#FFFFFF" stroke="#E8D9B0" stroke-width="2"/>
  <circle cx="130" cy="1366" r="26" fill="#DA291C"/>
  <text x="130" y="1377" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="30" font-weight="900" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="176" y="1377" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="32" font-weight="900" fill="#2B2118">回到项目页 · 点亮 Star</text>

  <rect x="110" y="1398" width="880" height="170" rx="12" fill="#F7F4EE" stroke="#E0D5B8" stroke-width="1.5"/>
  <rect x="170" y="1432" width="200" height="58" rx="29" fill="#FFFFFF" stroke="#C9B98F" stroke-width="2"/>
  <text x="270" y="1469" font-family="'Microsoft YaHei',sans-serif" font-size="23" fill="#7A4A1E" text-anchor="middle">☆ Star 3</text>
  <text x="270" y="1516" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="18" fill="#9A8B6C" text-anchor="middle">点亮前</text>
  <text x="452" y="1469" font-family="'Microsoft YaHei',sans-serif" font-size="34" font-weight="900" fill="#DA291C" text-anchor="middle">→</text>
  <rect x="545" y="1432" width="250" height="58" rx="29" fill="#FFC72C"/>
  <text x="670" y="1469" font-family="'Microsoft YaHei',sans-serif" font-size="23" font-weight="900" fill="#7A4A1E" text-anchor="middle">⭐ Starred 4</text>
  <text x="670" y="1516" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="18" fill="#9A8B6C" text-anchor="middle">点亮后</text>
  <text x="540" y="1552" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="20" font-weight="900" fill="#DA291C" text-anchor="middle">☆ 变成黄色 = 投票成功 · 数字会 +1</text>

  <!-- FAQ -->
  <rect x="78" y="1624" width="924" height="54" rx="14" fill="#FFF9EC" stroke="#E8D9B0" stroke-width="2"/>
  <text x="106" y="1658" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="20" font-weight="900" fill="#2B2118">Q：安全吗？要我的信息？</text>
  <text x="400" y="1658" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="20" fill="#7A4A1E">只读订单，不下单不领券，代码开源可审</text>

  <!-- CTA -->
  <rect x="0" y="1706" width="1080" height="214" fill="url(#hdr)"/>
  <rect x="0" y="1706" width="1080" height="6" fill="#FFC72C"/>
  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif" text-anchor="middle">
    <text x="540" y="1798" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="2">GitHub 搜索：mcd-mbti</text>
    <text x="540" y="1854" font-size="26" fill="#FFE9B8">测测你是什么麦门人格</text>
  </g>
</svg>
