  <text x="665" y="1247" font-family="'Microsoft YaHei',sans-serif" font-size="21" font-weight="900" fill="#7A4A1E" text-anchor="middle">⭐ Starred 4</text>
  <text x="665" y="1288" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="17" fill="#9A8B6C" text-anchor="middle">点亮后</text>
  <text x="540" y="1304" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="19" font-weight="900" fill="#DA291C" text-anchor="middle">☆ 变成黄色 = 投票成功 · 数字会 +1</text>

  <!-- CTA -->
  <rect x="0" y="1358" width="1080" height="82" fill="url(#hdr)"/>
  <rect x="0" y="1358" width="1080" height="6" fill="#FFC72C"/>
  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif" text-anchor="middle">
